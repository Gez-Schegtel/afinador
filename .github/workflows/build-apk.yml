name: Build Android APK

on:
  push:
    branches: ['main']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (con caché npm)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21 (preinstalado en el runner)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle con caché persistente
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install web & Capacitor dependencies
        run: npm ci

      - name: Run DSP precision test suite
        run: npm test -- --run

      - name: Build web assets and sync Capacitor Android
        run: |
          npm run build
          npx cap sync android

      - name: Prepare release keystore (si está configurado en Secrets)
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed_mode=release-keystore" >> "$GITHUB_OUTPUT"
          else
            echo "signed_mode=debug-fallback" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed Android APK with Gradle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Package APK and SHA-256 checksum
        id: package
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          APK_NAME="afinador-${VERSION}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "${APK_NAME}"
          sha256sum "${APK_NAME}" > "${APK_NAME}.sha256"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha_name=${APK_NAME}.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload APK as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: afinador-apk
          path: |
            ${{ steps.package.outputs.apk_name }}
            ${{ steps.package.outputs.sha_name }}
          if-no-files-found: error

      - name: Publish APK to GitHub Releases (en tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ steps.package.outputs.apk_name }}
            ${{ steps.package.outputs.sha_name }}
