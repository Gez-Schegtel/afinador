name: Build Android APK

on:
  push:
    branches: ['main']
    tags: ['v*']
  workflow_dispatch:

# Mínimo privilegio: solo el job de release (en tags) puede escribir en el repositorio.
permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    outputs:
      apk_name: ${{ steps.package.outputs.apk_name }}
      sha_name: ${{ steps.package.outputs.sha_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js (con caché npm)
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup Java 21 (preinstalado en el runner)
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle con caché persistente
        uses: gradle/actions/setup-gradle@v6

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install web & Capacitor dependencies
        run: npm ci

      - name: Run DSP precision test suite
        run: npm test -- --run

      - name: Build web assets and sync Capacitor Android
        run: |
          npm run build
          npx cap sync android

      - name: Prepare release keystore (si está configurado en Secrets)
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed_mode=release-keystore" >> "$GITHUB_OUTPUT"
          else
            echo "signed_mode=debug-fallback" >> "$GITHUB_OUTPUT"
          fi

      # Un tag publica un Release: firmarlo con la clave debug efímera del runner haría que ninguna
      # versión posterior pudiera instalarse encima (firma distinta en cada build).
      - name: Require release keystore for version tags
        if: startsWith(github.ref, 'refs/tags/v') && steps.keystore.outputs.signed_mode != 'release-keystore'
        run: |
          echo "::error::Los tags v* requieren los Secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS y ANDROID_KEY_PASSWORD."
          exit 1

      - name: Build signed Android APK with Gradle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Package APK and SHA-256 checksum
        id: package
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          APK_NAME="afinador-${VERSION}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "${APK_NAME}"
          sha256sum "${APK_NAME}" > "${APK_NAME}.sha256"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha_name=${APK_NAME}.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload APK as GitHub Actions Artifact
        uses: actions/upload-artifact@v7
        with:
          name: afinador-apk
          path: |
            ${{ steps.package.outputs.apk_name }}
            ${{ steps.package.outputs.sha_name }}
          if-no-files-found: error

  release:
    needs: build-apk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v7
        with:
          name: afinador-apk

      - name: Publish APK to GitHub Releases
        # Acción de terceros fijada por SHA (v3.0.4); Dependabot propone las actualizaciones.
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3
        with:
          generate_release_notes: true
          files: |
            ${{ needs.build-apk.outputs.apk_name }}
            ${{ needs.build-apk.outputs.sha_name }}
