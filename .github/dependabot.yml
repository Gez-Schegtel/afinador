# Avisos semanales de actualizaciones y vulnerabilidades (también actualiza las acciones fijadas por SHA).
version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
  - package-ecosystem: 'gradle'
    directory: '/android'
    schedule:
      interval: 'weekly'
